  <text x="152" y="531" fill="#263129" font-family="Arial,sans-serif" font-size="26" font-weight="700">Warnings</text>
  <path d="M152 559h496M152 580h450" stroke="#c3cbc0" stroke-width="7" stroke-linecap="round"/>
  <text x="152" y="645" fill="#263129" font-family="Arial,sans-serif" font-size="26" font-weight="700">Storage</text>
  <path d="M152 675h390" stroke="#c3cbc0" stroke-width="7" stroke-linecap="round"/>
</svg>
